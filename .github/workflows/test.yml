# This workflow runs the Jest test suite on pushes and pull requests
# and uploads coverage reports as artifacts.

name: Run Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Node 26 is a Lambda public preview runtime with no SLA; run it as an
    # early-warning signal only. Marking just the '26' leg continue-on-error
    # keeps a Node 26 failure from blocking the workflow (Req 2.2), while the
    # '20', '22', and '24' legs remain required (Req 2.3).
    continue-on-error: ${{ matrix.node-version == '26' }}

    strategy:
      # Do not cancel the required '20'/'22'/'24' legs if the experimental
      # '26' leg errors (Req 2.2).
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24', '26']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        if: matrix.node-version != '24'
        run: npm test -- --silent --no-verbose

      - name: Run tests with coverage
        if: matrix.node-version == '24'
        run: npm test -- --silent --no-verbose --coverage

      - name: Upload coverage report
        if: matrix.node-version == '24'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-jest/
          retention-days: 14
